name: Сборка KodMarsa.exe

on:
  push:
    branches: [ "**" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Найти папку с программой
        run: |
          $f = Get-ChildItem -Path . -Recurse -Filter kod_marsa.py | Select-Object -First 1
          if (-not $f) {
            $zip = Get-ChildItem -Path . -Recurse -Filter *.zip | Select-Object -First 1
            if ($zip) {
              Write-Host "Распаковываю архив $($zip.Name)"
              Expand-Archive -Path $zip.FullName -DestinationPath _unzipped -Force
              $f = Get-ChildItem -Path _unzipped -Recurse -Filter kod_marsa.py | Select-Object -First 1
            }
          }
          if (-not $f) {
            Write-Error "В репозитории нет файла kod_marsa.py. Загрузите файлы из архива kod-marsa-exe."
            exit 1
          }
          $dir = $f.DirectoryName -replace '\\', '/'
          Write-Host "Папка программы: $dir"
          "PROJ=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        working-directory: ${{ env.PROJ }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Проверка совместимости с Android-версией
        working-directory: ${{ env.PROJ }}
        run: python tests/test_compat.py

      - name: Собрать EXE
        working-directory: ${{ env.PROJ }}
        run: pyinstaller --noconfirm --clean --onefile --windowed --name KodMarsa --icon assets/icon.ico --add-data "assets;assets" --collect-all tkinterdnd2 --collect-all zxingcpp kod_marsa.py

      - name: Самопроверка готового EXE
        working-directory: ${{ env.PROJ }}
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "dist\KodMarsa.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path "dist\selftest.log") { Get-Content "dist\selftest.log" -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { Write-Error "Самопроверка не пройдена, код $($p.ExitCode)"; exit 1 }

      - name: Выложить EXE (раздел Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KodMarsa-Windows
          path: ${{ env.PROJ }}/dist/KodMarsa.exe

      - name: Приложить EXE к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJ }}/dist/KodMarsa.exe
